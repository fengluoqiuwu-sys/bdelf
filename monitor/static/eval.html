<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eval · bdelf monitor</title>
  <link rel="stylesheet" href="/common.css" />
</head>
<body>
  <header>
    <h1>bdelf monitor</h1>
    <span id="instance-badge" class="badge badge-instance" hidden></span>
    <nav>
      <a href="/train.html" data-nav="train">Train</a>
      <a href="/eval.html" data-nav="eval" class="active">Eval</a>
      <a href="/generate.html" data-nav="generate">Generate</a>
    </nav>
  </header>
  <main>
    <section id="model-view">
      <div class="filter-bar" id="model-toolbar">
        <input id="model-search" type="search" placeholder="按模型名搜索" autocomplete="off" />
        <div class="kind-filters" id="kind-filters">
          <button type="button" class="kind-filter active" data-kind="">全部</button>
          <button type="button" class="kind-filter" data-kind="lm">LM</button>
          <button type="button" class="kind-filter" data-kind="latent">Latent</button>
        </div>
      </div>
      <section id="model-section"><p class="muted">正在扫描离线 eval…</p></section>
    </section>
    <section id="hash-view" class="hidden">
      <a class="back-link" href="/eval.html">← 返回模型列表</a>
      <section id="hash-section"></section>
    </section>
    <section id="step-view" class="hidden">
      <a class="back-link" id="step-back" href="/eval.html">← 返回哈希列表</a>
      <section id="step-section"></section>
    </section>
    <section id="detail-view" class="hidden">
      <a class="back-link" id="detail-back" href="/eval.html">← 返回步数列表</a>
      <section id="detail-section"></section>
    </section>
    <section id="sample-view" class="hidden">
      <a class="back-link" id="sample-back" href="/eval.html">← 返回该步</a>
      <section id="sample-section"></section>
    </section>
  </main>
  <script type="module" src="/eval.js"></script>
</body>
</html>
