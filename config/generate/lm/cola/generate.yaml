# =============================================================================
# 生成 / 采样（generate=正式生成；eval=训练在线 gen-eval / 测试）
# =============================================================================
_doc: Cola Stage-2 正式生成采样  # 文件说明，写入 extra
name: generate  # 配置名；非 prototype 时与文件名一致
num_ode_steps: 16  # ODE 积分步数（官方 timestep_num=16）
cfg_scale: 7.0  # Classifier-free guidance 缩放
temperature: 0.0  # 采样温度；≤0 为 argmax
ode_T: 1000.0  # 推理 linspace(T,0) 的 T
