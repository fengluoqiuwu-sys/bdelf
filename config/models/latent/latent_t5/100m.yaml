_doc: T5-small 维数 latent AR ~60M（6+6×512；档位命名 100m）  # 文件说明，写入 extra

name: latent_t5-100m  # 配置名；非 prototype 时与文件名一致
tokenizer: gpt2  # 分词器名；与 config/tokenizers 一致
readout: e  # 读出：e=z∈E（默认）| b=z∈B
max_seq_len: 1024  # 训练序列长度
n_layer_enc: 6  # 编码器层数（T5-small）
n_layer_dec: 6  # 解码器层数（T5-small）
n_head: 8  # 注意力头数（512/64）
n_embd: 512  # 隐层宽度 E（T5-small d_model）
d_kv: 64  # 每头 K/V 维（T5-small）
d_ff: 2048  # FFN 中间维（T5-small）
latent_dim: 64  # 瓶颈维 B
dropout: 0.0  # Dropout
beta_kl: 0.1  # KL(q‖N(0,I)) 权重
lambda_span: 1.0  # span 辅助损失权重
span_mask_ratio: 0.15  # span 腐蚀比例
span_mean_len: 3  # span 平均长度
num_sentinels: 100  # encoder 专用 sentinel 数
bidirectional: true  # encoder 注意力：true=全双向（默认）| false=逐 token 单向因果
use_flash: true  # 是否 SDPA

sampling:
  temperature: 1.0  # 采样温度；≤0 为 argmax
