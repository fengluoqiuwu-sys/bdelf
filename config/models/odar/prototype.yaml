_doc: ODAR config template (Embedded Language Flows, no CFG / no SC-CFG)

name: prototype
tokenizer: t5-small
max_seq_len: 1024
encoder_model_name: t5-small
text_encoder_dim: 512
bottleneck_dim: 128
n_layer: 12
n_head: 12
n_embd: 768
dropout: 0.0
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4
self_cond_prob: 0.5
self_cond_cfg_min: 0.5
self_cond_cfg_max: 5.0
latent_mean: 0.0
latent_std: 0.2
denoiser_p_mean: -1.5
denoiser_p_std: 0.8
denoiser_noise_scale: 2.0
decoder_prob: 0.2
decoder_p_mean: 0.8
decoder_p_std: 0.8
decoder_noise_scale: 5.0
t_eps: 0.05
time_schedule: logit_normal

# DMA-H（日程化 embedding round-trip；进训练 hash）
dma_t0: 0.5  # t >= dma_t0 时对 SC / 采样 x_pred 做 round-trip
dma_mode: round_trip  # round_trip | gumbel（后者 T2b）
dma_tau: 1.0  # Gumbel 温度；round_trip 不用

sampling:
  sampling_method: sde
  num_sampling_steps: 32
  sde_gamma: 1.5
  time_schedule: logit_normal
  temperature: 0.0
  self_cond_cfg_scale: 0.5  # FAR-SC 默认；正式以 config/generate/odar 为准
