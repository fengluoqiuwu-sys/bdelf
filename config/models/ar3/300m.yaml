_doc: AR3 ~300M (AR2.5 + align)

name: ar3-300m
tokenizer: gpt2
block_size: 16
num_anchors: 1
t_window: 4
attn_type_bias: true
n_layer: 20
n_head: 16
n_embd: 1024
dropout: 0.1
attn_backend: flex
fix_bos: true
align_topk: 8
align_power: 2.0
align_mass_power: 1.0
align_logit_coef: 1.0
align_loss_coef: 0.1
align_warmup_ratio: 0.1
align_query_prob: 0.25

sampling:
  temperature: 1.0
