_doc: Block Diffusion + Flow LM ~300M（token emb latent，20×1024，block 16）

name: bdelf-300m                   # 配置名；与文件名一致
tokenizer: gpt2                     # GPT-2 词表；配合 preprocess=default
max_seq_len: 1024                  # 最大序列长度
text_encoder_dim: 512              # embedding / flow 空间维
bottleneck_dim: 128                # latent→hidden 瓶颈维
diffusion_block_size: 16           # block-diffusion 块长
n_layer: 20                        # Transformer 层数
n_head: 16                         # 注意力头数
n_embd: 1024                       # 隐层维
dropout: 0.0                       # dropout（仅中段层启用）
attn_backend: flex                 # 注意力后端：flex | sdpa
num_time_tokens: 4                 # in-context 时间 token 数
num_self_cond_cfg_tokens: 0        # SC-CFG scale token；0=关闭（保留普通 self-cond，少 1～2 次 forward）
num_model_mode_tokens: 4           # decode/denoise mode token 数
self_cond_prob: 0.5                # 训练时 self-cond 概率
self_cond_cfg_min: 0.5             # SC-CFG 采样下界
self_cond_cfg_max: 5.0             # SC-CFG 采样上界
latent_mean: 0.0                   # emb 归一化均值
latent_std: 0.2                    # emb 归一化标准差
denoiser_p_mean: -1.5              # denoise t 的 logit-normal 均值
denoiser_p_std: 0.8                # denoise t 的 logit-normal 标准差
denoiser_noise_scale: 2.0          # denoise 噪声尺度
decoder_prob: 0.5                  # mixed 中 decode 样本比例
decoder_p_mean: 0.8                # decode λ 的 logit-normal 均值
decoder_p_std: 0.8                 # decode λ 的 logit-normal 标准差
decoder_noise_scale: 5.0           # decode 噪声尺度
t_eps: 0.05                        # 1-t 下界，防除零
time_schedule: logit_normal        # 训练时间调度
fix_bos: true                      # 是否固定 BOS 位置为干净 latent
freeze_wte: true                   # 冻结 token embedding，避免与 unembed 合谋
wte_init: gpt2                     # embedding 初始化：gpt2 | random

sampling:
  temperature: 1.0                 # 采样温度；≤0 为 argmax
  # top_k: null                    # Top-k；省略=全词表
  num_ode_steps: 32                # ODE 积分步数
  time_schedule: logit_normal      # 推理时间调度
  use_fast_infer: true             # 是否走 prefix/suffix fast infer
  self_cond_cfg_scale: 1.0         # SC-CFG 关闭时无效；重开 tokens 后再调
