_doc: BELF 配置模板（块条件流；不可实例化）  # 文件说明，写入 extra

name: prototype  # 配置名；prototype 不可实例化
tokenizer: gpt2  # 分词器名；与 config/tokenizers 一致
max_seq_len: 4096  # 训练 / 生成最大序列长度
n_layer: 12  # G 的 AdaLN-Zero 层数
n_head: 12  # 注意力头数
n_embd: 768  # 隐层宽度 D
dropout: 0.0  # Dropout
mlp_ratio: 4.0  # SwiGLU 扩展比
latent_model: latent_vae  # 入口 latent 家族名
tag: 100m-b32-d1  # artifacts/latent/{latent_model}/{tag}
sc_cfg: true  # 是否建 ScaleEmbedder / w_sc 通道；主跑开
latent_tune: mid  # 入口可训档：frozen | full | mid；full/mid 要求入口块长 1
latent_dim: 32  # 流空间 X；须与 artifact 输出维一致
attn_backend: flex  # 注意力后端：flex | sdpa
block_size: 16  # G 去噪块长 W；入口 encoder 块长须 ∈{1,W}
proj_bias: true  # G 茎 Linear(X→D) 是否带 bias
proj_norm: rmsnorm  # 茎后归一化
whiten: true  # 入口逐维 μ 白化；m,s 由 artifact 导出后离线写入；缺则单位仿射
whiten_on: mu  # 白化统计作用对象
qk_norm: true  # Q/K RMSNorm
rope_dim: null  # 每头 RoPE 维；null 表示用 head_dim
rope_theta: 10000.0  # RoPE 基频
t_freq_dim: 256  # 时间正弦嵌入维
lm_head_bias: false  # lm_head 是否带 bias
noise_sigma: 1.0  # 插值噪声尺度
latent_thaw_tokens: 5000000000  # mid 解冻有效 token 点
denoiser_p_mean: -1.5  # 训练连续 t 的 logit-normal 均值（N(-1.5, 0.8^2)）
denoiser_p_std: 0.8  # 训练连续 t 的 logit-normal 标准差
t_clean_eps: 0.05  # 干净端 1-ε
vel_eps: 1.0e-3  # x-pred→v 分母下限
cond_mode: clean  # 条件模式；主跑 clean
clean_block_prob: 0.05  # 抽混合块并把余数钉 t=1 的概率
train_t_schedule: independent  # 训练抽 t：按样本连续 Ln
lambda_mse: 1.0  # 未知槽 v-MSE 权重
self_left_prob: 0.25  # 训练按样本把左段换成末流 sg(x_hat) 的概率；eval/生成视为 0
self_left_thaw_tokens: 5000000000  # self-left 解锁有效 token 点；0 表示一开始就开
lambda_s1: 1.0  # 联合训时 L_s1 权重
lambda_vae: 1.0  # s1 重建项权重
lambda_ref: 1.0  # s1 参考编码器 KL 权重
kl_entropy: false  # 开则 s1 为 β·(KL+E[log q])；缺键/false 与旧哈希相同
ctx_source: mu  # 左段条件锁死 μ；写 z 直接报错
x0_source: z  # 干净端来源：z | mu（仅此项可选）
self_cond_cfg_p_mean: -1.5  # w_sc 采样 logit-normal 均值
self_cond_cfg_p_std: 0.8  # w_sc 采样 logit-normal 标准差
self_cond_cfg_min: 0.5  # w_sc 下界
self_cond_cfg_max: 5.0  # w_sc 上界
sc_guided_prob: 0.5  # 训练 teacher 走 guided 混合的概率
ctx_p_drop: 0.1  # 丢掉左段前缀的概率（不进 AdaLN）

sampling:
  sampling_method: sde  # 采样方法：sde | ode
  sde_gamma: 1.5  # SDE churn 系数；末流关闭
  w_sc: 2.0  # 推理 self-cond CFG 缩放；sc_cfg 为假时忽略
  w_ctx: 1.0  # 推理上下文 CFG；1 表示不丢前缀
  temperature: 0.0  # 采样温度；≤0 为 argmax
  commit_x0hat: false  # 关=VAE-dec 读词再 encode；开=提交 x_hat，全文一次 VAE-dec
