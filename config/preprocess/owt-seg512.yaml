_doc: OWT 句段切分 + 定长 pad512（GPT-2 BPE，手动 BOS/EOS）

name: owt-seg512
tokenizer: gpt2
strategy: owt_segment
process_d: 512
min_chunk_len: 128
pad_mode: fixed
shuffle_seed: 42
chunk_length: 512
overflow_mode: discard
seed: 42
text_column: text
cache_source: hf  # 缓存构建：hf=下载 Hub 已切分成品；raw=从 OWT 原文切分（不进指纹）
hf_preprocessed_repo: fengluoqiuwu/owt-seg512  # Hub dataset 仓库，不进指纹
hf_preprocessed_revision: main  # Hub revision，不进指纹
