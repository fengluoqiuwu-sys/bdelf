_doc: latent 长度课程占位 preprocess（实际用 owt-seg512 + owt-bucket；进指纹）  # 文件说明，写入 extra

name: latent-curriculum
tokenizer: gpt2
strategy: owt_segment
chunk_length: 2048  # 课程最大图 L
process_d: 2048
min_chunk_len: 128
pad_mode: bucket
bucket_lengths: [256, 512, 1024, 2048]
shuffle_seed: 42
overflow_mode: discard
seed: 42
text_column: text
curriculum: latent-owt  # 指向 config/train/curriculum/latent-owt.yaml
