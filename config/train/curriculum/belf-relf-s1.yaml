_doc: BELF/RELF Stage1 主训（45B@512；owt-seg512）  # 文件说明，写入 extra
name: belf-relf-s1  # 配置名；非 prototype 时与文件名一致
effective_target_tokens: 45000000000  # 本阶段有效 token 预算（非 pad）
seg512_preprocess: owt-seg512  # 定长 512 数据源
bucket_preprocess: owt-bucket  # 分桶数据源（本阶段不用，与 s2 同键）
pad_token_key: pad  # 使用 tokenizer layout 的 pad_token_id

# 单阶段：有效预算、峰值图 L、全局条数、数据集、桶与有效 token 配比
# 训练图长见 train.latent_curriculum.batch_graph_l
stages:
  - name: s1  # 主训阶段名
    effective_budget: 45000000000  # 本阶段有效 token
    graph_l: 512  # 峰值图长
    global_seq_batch: 512  # 全局序列条数
    dataset: seg512  # 数据源：seg512 | bucket
    mix:
      512: 1.0  # 桶长 512 的有效 token 配比

observation_window_tokens: 0  # 入口观察窗（计入该阶段预算；s1 不用）
