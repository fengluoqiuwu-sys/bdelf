_doc: latent_t5/latent_vae 长度课程（10B 有效 token；owt-seg512 + owt-bucket）  # 文件说明，写入 extra
name: latent-owt  # 配置名；非 prototype 时与文件名一致
effective_target_tokens: 10000000000  # 全程有效 token 预算（非 pad）
seg512_preprocess: owt-seg512  # S1 数据源
bucket_preprocess: owt-bucket  # S2–S4 数据源
pad_token_key: pad  # 使用 tokenizer layout 的 pad_token_id

# S1–S4：effective_budget、峰值图 L、全局条数、数据集、桶与有效 token 配比
# 训练图长见 train.latent_curriculum.batch_graph_l（每阶段最多两档；微批按峰值 L 固定）
stages:
  - name: s1
    effective_budget: 3000000000
    graph_l: 512
    global_seq_batch: 512
    dataset: seg512
    mix:
      512: 1.0
  - name: s2
    effective_budget: 1500000000
    graph_l: 512
    global_seq_batch: 512
    dataset: bucket
    mix:
      256: 0.30
      512: 0.70
  - name: s3
    effective_budget: 2500000000
    graph_l: 1024
    global_seq_batch: 256
    dataset: bucket
    mix:
      256: 0.10
      512: 0.20
      1024: 0.70
  - name: s4
    effective_budget: 3000000000
    graph_l: 2048
    global_seq_batch: 128
    dataset: bucket
    mix:
      256: 0.05
      512: 0.10
      1024: 0.20
      2048: 0.65

observation_window_tokens: 200000000  # S3/S4 入口观察窗（计入该阶段预算）
