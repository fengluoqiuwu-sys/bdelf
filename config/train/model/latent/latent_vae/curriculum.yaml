# =============================================================================
# latent_vae · 长度课程（10B 有效 token；schedule=latent-curriculum）
# =============================================================================
_doc: latent_vae · curriculum（T5-small 维数；owt-seg512→bucket 四阶段）  # 文件说明，写入 extra
name: latent_vae  # 模型名；与目录名一致
variant: full  # checkpoint 目录仍用 full

optimizer:
  dtype: bf16
  learning_rate: 0.002
  weight_decay: 0
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1
  muon_learning_rate: 0.002
  muon_weight_decay: 0
  muon_momentum: 0.95
  muon_ns_steps: 5
  ema_decay: 0.997  # EMA 衰减；0 表示关闭

# -----------------------------------------------------------------------------
# Batch（每 GPU 微批随图长：S1/S2=16，S3=8，S4=4；accum 维持全局条数）
# -----------------------------------------------------------------------------
batch:
  batch_size: 4  # S4 微批；compose / eval 用最小档
  global_batch_size: 128  # 与 S4 global_seq_batch 对齐
  stage_batch_size:  # 按图 L → 每 GPU 微批（S1/S2 同为 512）
    512: 16
    1024: 8
    2048: 4
