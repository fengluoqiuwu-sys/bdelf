# =============================================================================
# 在线评测（held-out PPL + 生成式 PPL）
# =============================================================================
_doc: 评测配置模板（不可实例化）  # 文件说明，写入 extra
name: prototype  # 配置名；非 prototype 时与文件名一致
eval_sample_count: null  # held-out 子采样条数；null 表示全量
eval_sample_seed: 42  # held-out 子采样随机种子
# eval_split: dev  # 省略则自动：owt 用 dev，arxiv 等用 eval
vae_probe_samples: 16  # latent VAE probe 抽样数（0=关闭）
gen_eval_samples: 256  # 每次 gen-PPL 生成并打分的序列数
gen_eval_prefix_tokens: 32  # GPT-2 前缀 token 数；0=无条件生成（仅 supports_prefix 生效）
gen_eval_prefix_seed: 42  # 前缀起始种子，按 offset 递增；开训前生成且批次内互异
gen_eval_prefix_model: gpt2  # 生成前缀的 HF 因果 LM 名
